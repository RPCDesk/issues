name: Bug report
description: Something in rpcdesk is broken or behaves unexpectedly.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please reproduce once more before filing and redact paths,
        tokens, and prompts from anything you paste.

        Do **not** report security problems here — use the Security tab instead.
  - type: input
    id: version
    attributes:
      label: rpcdesk version
      description: Settings → About, or the file name of the installer you used.
      placeholder: 0.1.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (AppImage)
        - Linux (deb)
        - Linux (rpm)
        - Windows (x64)
        - Built from source
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Backend and version
      description: The harness selected for the tab, and its version (`omp --version`).
      placeholder: omp 18.12.6
    validations:
      required: true
  - type: dropdown
    id: approval
    attributes:
      label: Approval mode
      options:
        - follow-cli
        - ask
        - write
        - yolo
        - not sure
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace
        2. Send "…"
        3. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the on-screen error text if there is one.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        macOS `~/Library/Logs/rpcdesk/`, Linux `~/.local/state/rpcdesk/logs/`,
        Windows `%LOCALAPPDATA%\rpcdesk\logs\`. `sidecar-<tab>.log` holds the CLI's stderr;
        `updates.log` covers self-update.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, session files, plugins enabled.
